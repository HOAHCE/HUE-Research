[project]
name = "postudio"
version = "0.1.0"
description = "Automated research-paper drafting (PaperOrchestra-based) with verified literature, Claude/Gemini/OpenAI backends and a web UI"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dynamic = ["dependencies"]
[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
[tool.setuptools]
packages = ["postudio"]
[project.scripts]
postudio = "postudio.cli:main"
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
